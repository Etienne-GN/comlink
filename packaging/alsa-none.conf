# ALSA configuration used when Comlink is asked for no audio device.
#
# Deliberately empty. With ALSA_CONFIG_PATH pointing here, alsa-lib
# loads only this file, so no device is defined and no sound-server
# plugin is dlopened while pjmedia enumerates audio drivers.
#
# The reason this file exists rather than the setting simply being
# honoured: pjsua_init initialises every audio driver before any
# application setting is read, and ALSA's "default" is the pipewire ctl
# plugin on a desktop Debian box. With the pipewire socket unreachable,
# that plugin's failure path joins a loop thread nothing wakes, and the
# process hangs inside pjsua_init before any Comlink code runs. A
# headless box is where that happens and where "none" is used.
#
# The null audio device compiled in via scripts/config_site_debian.h is
# what keeps pjmedia's audio subsystem valid with no real driver
# present. Without it, pjsua_init fails with PJMEDIA_EAUD_SYSERR.
#
# See docs/known-issues.md.
