# OpenSSL's Android targets, with the library names Qt looks for.
#
# Qt's OpenSSL TLS backend loads libssl_3.so and libcrypto_3.so on
# Android (qsslsocket_openssl_symbols.cpp: "ssl" + "_" + the major
# version), and shlib_variant puts that suffix into both the file name
# and the SONAME, so a library linked against them asks for the same
# names Qt loads. scripts/build-deps-android.sh passes this with
# --config.
my %targets = (
    "comlink-android-arm64" => {
        inherit_from  => [ "android-arm64" ],
        shlib_variant => "_3",
    },
    "comlink-android-x86_64" => {
        inherit_from  => [ "android-x86_64" ],
        shlib_variant => "_3",
    },
);
