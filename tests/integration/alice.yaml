log_level: 0
sip_port: @PORT@
audio_device: none
codec_priority: [PCMU]
accounts:
  - id: a
    user: alice
    domain: 127.0.0.1
    transport: udp
    register: false
header_rules:
  - name: strip-ua
    direction: tx
    message: request
    method: [INVITE]
    actions:
      - remove: User-Agent
      - set: {name: X-Sp-Rule, value: applied}
