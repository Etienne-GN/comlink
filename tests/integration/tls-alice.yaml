log_level: 0
sip_port: @PORT@
audio_device: none
codec_priority: [PCMU]
tls_cert_file: @CERTDIR@/cert.pem
tls_key_file: @CERTDIR@/key.pem
accounts:
  - id: a
    user: alice
    domain: 127.0.0.1
    transport: tls
    register: false
header_rules:
  - name: tls-tag
    direction: tx
    message: request
    method: [INVITE]
    actions:
      - remove: User-Agent
      - set: {name: X-Sp-Tls, value: yes}
