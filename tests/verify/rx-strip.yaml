log_level: 0
sip_port: @PORT@
audio_device: none
codec_priority: [PCMU]
accounts:
  - id: b
    user: bob
    domain: 127.0.0.1
    transport: udp
    register: false
header_rules:
  - name: strip-inbound-contact
    direction: rx
    message: request
    method: [INVITE]
    actions:
      - remove: Contact
